<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GleanGrid: my orders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-head { padding: 44px 0 20px; }
    .page-head h1 {
      font-family: var(--head);
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .page-head p { color: var(--muted); max-width: 55ch; }
    .orders { border-bottom: 2px solid var(--ink); }
    .order {
      display: grid;
      grid-template-columns: 0.4fr 1.6fr 1fr 0.9fr 1fr;
      gap: 20px;
      align-items: center;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }
    .order:first-child { border-top: 2px solid var(--ink); }
    .order .id { font-family: var(--head); font-weight: 700; font-size: 1.2rem; }
    .order .product { font-family: var(--head); font-weight: 700; font-size: 1.1rem; line-height: 1.25; }
    .order .meta { color: var(--muted); font-size: 0.9rem; }
    .status {
      display: inline-block;
      padding: 3px 10px;
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: capitalize;
    }
    .status.pending { background: var(--mango); }
    .status.confirmed, .status.packed, .status.dispatched { background: var(--track); }
    .status.collected { background: var(--leaf); color: #fff; border-color: var(--leaf); }
    .status.rejected, .status.cancelled, .status.returned { color: var(--chilli); border-color: var(--chilli); }
    .btn.cancel { background: transparent; color: var(--chilli); border-color: var(--chilli); padding: 7px 12px; font-size: 0.9rem; justify-self: start; }
    .note { margin: 6px 0 14px; font-weight: 500; min-height: 1.5em; }
    .note.error { color: var(--chilli); }
    .note.ok { color: var(--leaf); }
    @media (max-width: 760px) {
      .order { grid-template-columns: 1fr 1fr; gap: 12px; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">GleanGrid</a>
    <nav>
      <a href="/">Marketplace</a>
      <a href="/my-orders.html" aria-current="page">My orders</a>
      <a href="/login.html" class="login">Log in</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <h1>Your orders</h1>
      <p>A cart with products from different sellers becomes one order for each seller. You can cancel an order until the seller packs it, and the reserved stock is freed right away.</p>
    </section>

    <p class="note" id="note" role="status"></p>
    <section class="orders" id="orders" aria-live="polite"></section>
  </main>

  <script>
    const list = document.getElementById('orders');
    const note = document.getElementById('note');

    function esc(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function showNote(text, type) {
      note.textContent = text;
      note.className = 'note ' + type;
    }

    function orderHTML(o) {
      const canCancel = o.status === 'pending' || o.status === 'confirmed';
      const date = new Date(o.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      const lines = o.items.map(i => `<div class="product">${esc(i.name)} <span class="meta">${i.qty} kg</span></div>`).join('');
      return `
        <article class="order">
          <div class="id">#${o.id}</div>
          <div>${lines}</div>
          <div>
            <strong>Rs ${Number(o.total_amount).toLocaleString('en-PK')}</strong>
            <div class="meta">${date}</div>
            <div class="meta">${o.fulfilment === 'delivery' ? 'Delivery' : 'Pickup'}</div>
          </div>
          <div><span class="status ${o.status}">${o.status}</span></div>
          <div>${canCancel ? `<button class="btn cancel" data-id="${o.id}">Cancel order</button>` : ''}</div>
        </article>`;
    }

    async function loadOrders() {
      try {
        const res = await fetch('/api/orders/mine');
        if (res.status === 401 || res.status === 403) {
          list.innerHTML = '<p class="empty">Log in with a buyer account to see your orders. <a href="/login.html">Go to log in</a></p>';
          return;
        }
        const orders = await res.json();
        list.innerHTML = orders.length
          ? orders.map(orderHTML).join('')
          : '<p class="empty">You have not placed any orders yet.</p>';
      } catch (err) {
        list.innerHTML = '<p class="empty">Could not load orders. Check that the server is running, then refresh.</p>';
      }
    }

    list.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-id]');
      if (!btn) return;
      if (!confirm('Cancel order #' + btn.dataset.id + '?')) return;
      btn.disabled = true;
      try {
        const res = await fetch('/api/orders/' + btn.dataset.id + '/cancel', { method: 'POST' });
        const data = await res.json();
        showNote(data.message || data.error, res.ok ? 'ok' : 'error');
      } catch (err) {
        showNote('Could not reach the server. Please try again.', 'error');
      }
      loadOrders();
    });

    loadOrders();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>

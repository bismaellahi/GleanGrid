<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GleanGrid: admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .page-head { padding: 44px 0 20px; }
    .page-head h1 {
      font-family: var(--head);
      font-size: clamp(2rem, 4.5vw, 3rem);
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }
    .page-head p { color: var(--muted); max-width: 55ch; }
    .counts { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
    .counts div { padding: 18px 20px; border-left: 1px solid var(--line); }
    .counts div:first-child { border-left: none; padding-left: 0; }
    .counts strong { display: block; font-family: var(--head); font-size: 2.2rem; line-height: 1.1; }
    .counts span { color: var(--muted); font-size: 0.9rem; }
    h2.section {
      font-family: var(--head);
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      margin: 36px 0 10px;
    }
    .table-wrap { overflow-x: auto; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { text-align: left; padding: 11px 14px 11px 0; border-top: 1px solid var(--line); font-size: 0.95rem; }
    thead th { border-top: none; color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.off td { color: var(--muted); }
    td input[type="text"] {
      font: inherit;
      padding: 6px 10px;
      border: 2px solid var(--ink);
      background: #fff;
      border-radius: 3px;
      width: 100%;
      max-width: 260px;
    }
    .status {
      display: inline-block;
      padding: 2px 9px;
      border: 1.5px solid var(--ink);
      border-radius: 3px;
      font-weight: 600;
      font-size: 0.82rem;
      text-transform: capitalize;
    }
    .status.pending { background: var(--mango); }
    .status.confirmed, .status.packed, .status.dispatched { background: var(--track); }
    .status.collected { background: var(--leaf); color: #fff; border-color: var(--leaf); }
    .status.rejected, .status.cancelled, .status.returned { color: var(--chilli); border-color: var(--chilli); }
    .low { color: var(--chilli); font-weight: 600; }
    .mini {
      font: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 5px 12px;
      border: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      border-radius: 3px;
      cursor: pointer;
    }
    .mini.danger { color: var(--chilli); border-color: var(--chilli); }
    .inline-form { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .inline-form input {
      font: inherit;
      padding: 9px 12px;
      border: 2px solid var(--ink);
      background: #fff;
      border-radius: 3px;
      width: 260px;
      max-width: 100%;
    }
    .inline-form .btn { justify-self: auto; }
    .note { margin: 14px 0 0; font-weight: 500; min-height: 1.5em; }
    .note.error { color: var(--chilli); }
    .note.ok { color: var(--leaf); }
    @media (max-width: 760px) {
      .counts { grid-template-columns: 1fr 1fr; }
      .counts div:nth-child(3) { border-left: none; padding-left: 0; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">GleanGrid</a>
    <nav>
      <a href="/">Marketplace</a>
      <a href="/admin.html" aria-current="page">Admin</a>
      <a href="/login.html" class="login">Log in</a>
    </nav>
  </header>

  <main>
    <section class="page-head">
      <h1>Admin overview</h1>
      <p>Users, categories, low stock and the latest orders in one place.</p>
    </section>

    <p class="note" id="note" role="status"></p>
    <div id="content" aria-live="polite"></div>
  </main>

  <script>
    const content = document.getElementById('content');
    const note = document.getElementById('note');

    function esc(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML.replace(/"/g, '&quot;');
    }

    function showNote(text, type) {
      note.textContent = text;
      note.className = 'note ' + type;
    }

    function fmtDate(value) {
      return new Date(value).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function render(data) {
      const c = data.counts;

      const lowRows = data.low_stock.map(p => `<tr>
          <td>${esc(p.name)}</td>
          <td>${esc(p.seller)}</td>
          <td class="num">${p.on_hand}</td>
          <td class="num">${p.reserved}</td>
          <td class="num low">${p.on_hand - p.reserved}</td>
        </tr>`).join('');

      const orderRows = data.orders.map(o => `<tr>
          <td>#${o.id}</td>
          <td>${esc(o.product)}</td>
          <td>${esc(o.buyer)}</td>
          <td class="num">${o.qty} kg</td>
          <td class="num">Rs ${Number(o.total_amount).toLocaleString('en-PK')}</td>
          <td><span class="status ${o.status}">${o.status}</span></td>
          <td>${fmtDate(o.created_at)}</td>
        </tr>`).join('');

      const userRows = data.users.map(u => {
        const toggle = u.role === 'admin' ? '' :
          `<button class="mini ${u.is_active ? 'danger' : ''}" data-user="${u.id}" data-active="${u.is_active ? 0 : 1}">${u.is_active ? 'Disable' : 'Enable'}</button>`;
        return `<tr class="${u.is_active ? '' : 'off'}">
          <td>${esc(u.name)}</td>
          <td>${esc(u.email)}</td>
          <td style="text-transform:capitalize">${u.role}</td>
          <td>${esc(u.place || '')}</td>
          <td>${u.is_active ? 'Active' : 'Disabled'}</td>
          <td>${toggle}</td>
        </tr>`;
      }).join('');

      const catRows = data.categories.map(cat => `<tr>
          <td><input type="text" value="${esc(cat.name)}" maxlength="60" aria-label="Category name"></td>
          <td class="num">${cat.products}</td>
          <td><button class="mini" data-cat="${cat.id}">Save name</button></td>
        </tr>`).join('');

      content.innerHTML = `
        <div class="counts">
          <div><strong>${c.users}</strong><span>Users</span></div>
          <div><strong>${c.products}</strong><span>Products</span></div>
          <div><strong>${c.orders}</strong><span>Online orders</span></div>
          <div><strong>${c.pos_sales}</strong><span>Counter sales</span></div>
        </div>

        <h2 class="section">Users</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Place</th><th>Status</th><th></th></tr></thead>
            <tbody>${userRows}</tbody>
          </table>
        </div>

        <h2 class="section">Categories</h2>
        <form class="inline-form" id="cat-form">
          <input id="cat-name" type="text" maxlength="60" placeholder="New category, for example Grains" required>
          <button class="btn" type="submit">Add category</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th class="num">Products</th><th></th></tr></thead>
            <tbody>${catRows}</tbody>
          </table>
        </div>

        <h2 class="section">Low stock (20 kg or less available)</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Product</th><th>Seller</th><th class="num">On hand</th><th class="num">Reserved</th><th class="num">Available</th></tr></thead>
            <tbody>${lowRows || '<tr><td colspan="5">Nothing is running low.</td></tr>'}</tbody>
          </table>
        </div>

        <h2 class="section">Latest orders</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Order</th><th>Product</th><th>Buyer</th><th class="num">Qty</th><th class="num">Total</th><th>Status</th><th>Date</th></tr></thead>
            <tbody>${orderRows || '<tr><td colspan="7">No orders yet.</td></tr>'}</tbody>
          </table>
        </div>`;
    }

    async function load() {
      try {
        const res = await fetch('/api/admin/overview');
        if (res.status === 401 || res.status === 403) {
          content.innerHTML = '<p class="empty">Log in with the admin account to see this page. <a href="/login.html">Go to log in</a></p>';
          return;
        }
        render(await res.json());
      } catch (err) {
        content.innerHTML = '<p class="empty">Could not load the overview. Check that the server is running, then refresh.</p>';
      }
    }

    async function post(url, body) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        showNote(data.message || data.error, res.ok ? 'ok' : 'error');
        return res.ok;
      } catch (err) {
        showNote('Could not reach the server. Please try again.', 'error');
        return false;
      }
    }

    content.addEventListener('click', async (e) => {
      const userBtn = e.target.closest('button[data-user]');
      if (userBtn) {
        await post('/api/admin/users/' + userBtn.dataset.user + '/active', { active: userBtn.dataset.active === '1' });
        load();
        return;
      }
      const catBtn = e.target.closest('button[data-cat]');
      if (catBtn) {
        const name = catBtn.closest('tr').querySelector('input').value;
        await post('/api/admin/categories/' + catBtn.dataset.cat + '/rename', { name });
        load();
      }
    });

    content.addEventListener('submit', async (e) => {
      if (e.target.id !== 'cat-form') return;
      e.preventDefault();
      const ok = await post('/api/admin/categories', { name: document.getElementById('cat-name').value });
      if (ok) load();
    });

    load();
  </script>
  <script src="js/nav.js"></script>
</body>
</html>

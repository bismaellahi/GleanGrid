<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GleanGrid: log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .auth { max-width: 440px; margin: 0 auto; padding: 50px 0 80px; }
    .auth h1 { font-family: var(--head); font-size: 2.4rem; letter-spacing: -1px; margin-bottom: 18px; }
    .tabs { display: flex; margin-bottom: 22px; border-bottom: 2px solid var(--ink); }
    .tab {
      font: inherit; font-weight: 600; background: none; border: none;
      padding: 10px 18px; cursor: pointer; color: var(--muted);
    }
    .tab.active { color: var(--ink); border-bottom: 4px solid var(--mango); margin-bottom: -2px; }
    .auth label { display: block; font-weight: 500; margin: 14px 0 5px; }
    .auth input, .auth select {
      font: inherit; width: 100%; padding: 10px 12px;
      border: 2px solid var(--ink); background: #fff; border-radius: 3px;
    }
    .auth .btn { width: 100%; margin-top: 22px; justify-self: auto; }
    .msg { margin-top: 16px; font-weight: 500; }
    .msg.error { color: var(--chilli); }
    .msg.ok { color: var(--leaf); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">GleanGrid</a>
    <nav>
      <a href="/">Marketplace</a>
      <a href="/sell.html">Sell produce</a>
      <a href="/login.html" class="login">Log in</a>
    </nav>
  </header>

  <main>
    <div class="auth">
      <h1>Welcome back</h1>

      <div class="tabs">
        <button class="tab active" id="tab-login">Log in</button>
        <button class="tab" id="tab-register">Create account</button>
      </div>

      <form id="login-form">
        <label for="l-email">Email</label>
        <input id="l-email" type="email" autocomplete="email" required>
        <label for="l-password">Password</label>
        <input id="l-password" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Log in</button>
      </form>

      <form id="register-form" class="hidden">
        <label for="r-name">Full name</label>
        <input id="r-name" type="text" required>
        <label for="r-email">Email</label>
        <input id="r-email" type="email" autocomplete="email" required>
        <label for="r-password">Password (at least 6 characters)</label>
        <input id="r-password" type="password" autocomplete="new-password" required>
        <label for="r-role">I want to</label>
        <select id="r-role">
          <option value="buyer">Buy produce</option>
          <option value="seller">Sell produce</option>
        </select>
        <label for="r-place">City or town</label>
        <input id="r-place" type="text" placeholder="Hyderabad">
        <button class="btn" type="submit">Create account</button>
      </form>

      <p class="msg" id="msg" role="status"></p>
    </div>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const msg = document.getElementById('msg');

    function showMsg(text, type) {
      msg.textContent = text;
      msg.className = 'msg ' + type;
    }

    function showTab(which) {
      const isLogin = which === 'login';
      loginForm.classList.toggle('hidden', !isLogin);
      registerForm.classList.toggle('hidden', isLogin);
      tabLogin.classList.toggle('active', isLogin);
      tabRegister.classList.toggle('active', !isLogin);
      showMsg('', '');
    }

    tabLogin.addEventListener('click', () => showTab('login'));
    tabRegister.addEventListener('click', () => showTab('register'));

    async function send(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      return { ok: res.ok, data };
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { ok, data } = await send('/api/auth/login', {
          email: document.getElementById('l-email').value,
          password: document.getElementById('l-password').value
        });
        if (!ok) return showMsg(data.error, 'error');
        showMsg('Logged in. Taking you to the marketplace...', 'ok');
        setTimeout(() => { window.location.href = '/'; }, 800);
      } catch (err) {
        showMsg('Could not reach the server. Check that it is running.', 'error');
      }
    });

    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { ok, data } = await send('/api/auth/register', {
          name: document.getElementById('r-name').value,
          email: document.getElementById('r-email').value,
          password: document.getElementById('r-password').value,
          role: document.getElementById('r-role').value,
          place: document.getElementById('r-place').value
        });
        if (!ok) return showMsg(data.error, 'error');
        showTab('login');
        showMsg(data.message, 'ok');
      } catch (err) {
        showMsg('Could not reach the server. Check that it is running.', 'error');
      }
    });
  </script>
  <script src="js/nav.js"></script>
</body>
</html>
